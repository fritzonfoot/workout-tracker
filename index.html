<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f5ef">
  <meta name="description" content="A simple Push, Pull, Legs tracker for your kettlebell, pull-up bar, and mat.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Workout">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="./styles.css">
  <title>Workout · A little stronger</title>
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="app">
    <header class="masthead">
      <a class="brand" href="#workout" aria-label="Workout home"><span class="brand-mark" aria-hidden="true">↗</span> workout<span class="brand-dot">.</span></a>
      <button class="icon-button" id="settings-button" aria-label="Open settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 7h16M4 17h16"/><circle cx="9" cy="7" r="3" fill="var(--paper)"/><circle cx="15" cy="17" r="3" fill="var(--paper)"/></svg></button>
    </header>
    <p id="storage-warning" class="warning" role="alert" hidden></p>
    <main id="main"></main>
    <nav class="bottom-nav" aria-label="Main navigation">
      <button id="workout-nav" class="nav-item active" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M8 6v12M16 6v12M4 8v8M20 8v8M8 12h8"/></svg>Workout</button>
      <button id="history-nav" class="nav-item"><svg viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M4 6v5h5M4 11a8 8 0 1 1 1.4 6.5M12 7v5l3 2"/></svg>History</button>
    </nav>
  </div>
  <dialog id="modal"><div id="modal-content"></div></dialog>
  <div id="toast" role="status" class="toast" hidden></div>
  <noscript><p>This tracker needs JavaScript enabled to save workouts.</p></noscript>
</body>
</html>
